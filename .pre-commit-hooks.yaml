- id: moldy
  name: moldy
  description: Format C/C++ source files with moldy (override types_or for other languages)
  entry: moldy --in-place
  language: rust
  types_or: [c, c++]
  # Show moldy's per-file lines and summary even when the hook passes. A file
  # moldy cannot format (left unchanged, unreadable) fails the hook (exit 3).
  verbose: true
