# Trailing spaces and tabs, and lines of spaces past the indentation,
# are part of a block scalar's value.
literal: |
    two trailing spaces  
    next
folded: >
      tab at the end	
      a line of spaces past the indentation follows
         
      end
clip:
    - |
      last line of spaces is content
        
    - after
indicator:
  - |2
     z 

     w
keep: |+
  k


tab_line: |
  x
  	
kept_tab_line: |+
  x
   	
# A scalar of only spaces holds empty lines.
spaces_only: |
    
# With an indentation indicator, lines of spaces move with the owner.
indicated:
    a: |2
         
    b: |2+
         
    c: >2
         
    d:
    - |2
         
# A tab after the indentation is text, so later lines of spaces are too.
tab_only: |
  	
   
nested_tab_only:
    a: |
      	
         
nbsp:  x
last: |+
  end  

